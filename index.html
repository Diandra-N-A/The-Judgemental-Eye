<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Judgmental Eye</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- Three.js r128 & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      color-scheme: light;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 42%, #FFFFFF 0%, #F7F7F9 58%, #EFEFF3 100%);
      color: #1D1D1F;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .font-mono-tech {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }
    /* Apple Frosted Glass Surfaces */
    .glass-pill {
      background: rgba(255, 255, 255, 0.80);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(26px) saturate(190%);
      -webkit-backdrop-filter: blur(26px) saturate(190%);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .apple-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .apple-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .apple-scroll::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.14);
      border-radius: 9999px;
    }
    .apple-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.26);
    }
    /* Minimalist Range Slider */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(0, 0, 0, 0.11);
      height: 4px;
      border-radius: 9999px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 9999px;
      background: #1D1D1F;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.12);
    }
    /* Right Drawer Slide Transition */
    #right-drawer {
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }
    #right-drawer.drawer-hidden {
      transform: translateX(28px);
      opacity: 0;
      pointer-events: none;
    }
    #hover-tooltip {
      transition: opacity 0.12s ease;
    }
    .cursor-sim-active {
      cursor: crosshair;
    }
    /* Wokwi 2D Dot-Grid Workspace */
    .wokwi-canvas-bg {
      background-color: #FAFAFA;
      background-image: radial-gradient(rgba(0, 0, 0, 0.11) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .wokwi-wire {
      cursor: pointer;
      transition: opacity 0.18s ease, stroke-width 0.18s ease, filter 0.18s ease;
    }
    .wokwi-wire:hover {
      filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.55));
    }
    .wokwi-comp {
      cursor: pointer;
    }
    .wokwi-strip-highlight {
      transition: opacity 0.16s ease;
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -24; }
    }
    .wire-flow-anim {
      stroke-dasharray: 8 4;
      animation: dashFlow 0.7s linear infinite;
    }
  </style>
</head>
<body class="relative w-screen h-screen select-none overflow-hidden">

  <!-- ==================== FULL-BLEED 3D STUDIO CANVAS ==================== -->
  <div id="canvas-stage" class="fixed inset-0 w-full h-full z-0"></div>

  <!-- ==================== FULL-VIEWPORT 2D WOKWI SCHEMATIC OVERLAY (BUILD MODE ONLY) ==================== -->
  <div id="wokwi-overlay" class="hidden fixed inset-0 z-10 wokwi-canvas-bg flex flex-col">
    <!-- Wokwi Floating Top-Center Controls Bar -->
    <div class="fixed top-4 left-1/2 -translate-x-1/2 z-20 glass-pill rounded-full px-2 py-1 flex items-center gap-1.5 max-w-[92vw] overflow-x-auto">
      <div class="flex items-center gap-0.5 bg-black/[0.05] rounded-full p-0.5 text-[11px] font-semibold">
        <button id="wokwi-mode-demo" type="button" class="px-3 py-1 rounded-full bg-[#1D1D1F] text-white transition whitespace-nowrap"></button>
        <button id="wokwi-mode-debug" type="button" class="px-3 py-1 rounded-full text-[#6E6E73] hover:text-[#1D1D1F] transition whitespace-nowrap"></button>
      </div>
      <div class="w-px h-4 bg-black/[0.1] mx-0.5 shrink-0"></div>
      <button id="wokwi-zoom-out" type="button" class="w-7 h-7 rounded-full hover:bg-black/[0.06] text-[#1D1D1F] text-sm font-semibold flex items-center justify-center">−</button>
      <span id="wokwi-zoom-pct" class="text-[11px] font-mono-tech text-[#6E6E73] w-10 text-center">100%</span>
      <button id="wokwi-zoom-in" type="button" class="w-7 h-7 rounded-full hover:bg-black/[0.06] text-[#1D1D1F] text-sm font-semibold flex items-center justify-center">+</button>
      <button id="wokwi-zoom-reset" type="button" class="px-2.5 py-1 rounded-full hover:bg-black/[0.06] text-[11px] font-medium text-[#6E6E73] hover:text-[#1D1D1F] whitespace-nowrap"></button>
    </div>

    <!-- Interactive Pan/Zoom SVG Container -->
    <div id="wokwi-viewport" class="flex-1 w-full h-full overflow-hidden flex items-center justify-center cursor-grab active:cursor-grabbing pt-14 pb-20">
      <div id="wokwi-svg-wrap" class="origin-center transition-transform duration-100 ease-out w-full max-w-[1260px] px-4">
        <!-- High-precision Wokwi-style SVG injected dynamically -->
      </div>
    </div>

    <!-- Floating Net Inspector Pill (Bottom-Left in 2D View) -->
    <div id="wokwi-net-card" class="fixed bottom-20 left-5 sm:left-7 z-20 glass-panel rounded-2xl p-3.5 w-[calc(100vw-2.5rem)] max-w-[330px] text-[12px]">
      <div class="flex items-center justify-between gap-2 mb-1.5">
        <div class="flex items-center gap-2 min-w-0">
          <span id="wokwi-net-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span>
          <span id="wokwi-net-title" class="font-semibold text-[#1D1D1F] truncate"></span>
        </div>
        <button id="wokwi-net-clear" type="button" class="hidden text-[11px] font-medium text-[#6E6E73] hover:text-[#1D1D1F] underline shrink-0"></button>
      </div>
      <div id="wokwi-net-body" class="text-[11px] text-[#6E6E73] leading-relaxed space-y-1.5"></div>
    </div>
  </div>

  <!-- ==================== HOVER TOOLTIP (3D & 2D PIN INSPECTOR) ==================== -->
  <div id="hover-tooltip" class="fixed z-40 pointer-events-none opacity-0 px-2.5 py-1 rounded-full glass-pill text-[11px] font-medium text-[#1D1D1F] whitespace-nowrap"></div>

  <!-- ==================== TOP-LEFT: PURE TITLE ONLY (NO ICON, NO VERSION, NO SUBTITLE) ==================== -->
  <div class="fixed top-5 left-5 sm:top-6 sm:left-7 z-30 pointer-events-none">
    <h1 class="text-[17px] sm:text-[19px] font-semibold tracking-[-0.025em] text-[#1D1D1F]">The Judgmental Eye</h1>
  </div>

  <!-- ==================== TOP-RIGHT: LANGUAGE (ID | EN) & MODE (PRESENT / BUILD) ==================== -->
  <div class="fixed top-4 right-4 sm:top-5 sm:right-6 z-30 flex items-center gap-2">
    <!-- Language Switch -->
    <div class="glass-pill rounded-full p-1 flex items-center gap-0.5 text-[11px] font-semibold tracking-wide">
      <button id="btn-lang-id" type="button" class="px-2.5 py-1 rounded-full bg-[#1D1D1F] text-white transition-all duration-200">ID</button>
      <button id="btn-lang-en" type="button" class="px-2.5 py-1 rounded-full text-[#6E6E73] hover:text-[#1D1D1F] transition-all duration-200">EN</button>
    </div>

    <!-- Mode Switch (Default: Presentation) -->
    <div class="glass-pill rounded-full p-1 flex items-center gap-0.5 text-[12px] font-medium">
      <button id="btn-mode-present" type="button" class="px-3 py-1 rounded-full bg-[#1D1D1F] text-white transition-all duration-200"></button>
      <button id="btn-mode-build" type="button" class="px-3 py-1 rounded-full text-[#6E6E73] hover:text-[#1D1D1F] transition-all duration-200"></button>
    </div>
  </div>

  <!-- ==================== BOTTOM-LEFT: OV2640 240x240 MINI-HUD (SIMULATION ONLY) ==================== -->
  <div id="ov2640-hud" class="hidden fixed bottom-20 left-5 sm:left-7 z-20 glass-panel rounded-2xl p-3 w-[228px] sm:w-[244px]">
    <div class="flex items-center justify-between mb-2">
      <span class="text-[10px] font-mono-tech font-semibold uppercase tracking-wider text-[#6E6E73]">OV2640 · 240×240</span>
      <span id="hud-state-badge" class="text-[10px] font-mono-tech font-semibold px-2 py-0.5 rounded-full bg-black/[0.06] text-[#1D1D1F]">TRACKING</span>
    </div>

    <div class="relative w-full aspect-square rounded-xl overflow-hidden bg-[#F4F5F7] border border-black/[0.07] mb-2.5">
      <canvas id="hud-canvas" width="240" height="240" class="w-full h-full block"></canvas>
      <div class="absolute bottom-1.5 left-1.5 px-1.5 py-0.5 rounded bg-white/85 text-[9px] font-mono-tech text-[#1D1D1F] border border-black/[0.06]">
        W: <span id="hud-bbox-px">86px</span>
      </div>
      <div class="absolute bottom-1.5 right-1.5 px-1.5 py-0.5 rounded bg-white/85 text-[9px] font-mono-tech text-[#1D1D1F] border border-black/[0.06]">
        <span id="hud-dist-cm">48 cm</span>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-1.5 text-center mb-2">
      <div class="rounded-lg bg-black/[0.03] py-1">
        <div class="text-[9px] text-[#86868B] uppercase">Pan</div>
        <div id="hud-pan" class="text-[11px] font-mono-tech font-semibold text-[#1D1D1F]">0.0°</div>
      </div>
      <div class="rounded-lg bg-black/[0.03] py-1">
        <div class="text-[9px] text-[#86868B] uppercase">Tilt</div>
        <div id="hud-tilt" class="text-[11px] font-mono-tech font-semibold text-[#1D1D1F]">0.0°</div>
      </div>
      <div class="rounded-lg bg-black/[0.03] py-1">
        <div class="text-[9px] text-[#86868B] uppercase">Eyelid</div>
        <div id="hud-lid" class="text-[11px] font-mono-tech font-semibold text-[#1D1D1F]">0.0°</div>
      </div>
    </div>

    <div class="space-y-1 pt-2 border-t border-black/[0.06] text-[10px] font-mono-tech text-[#6E6E73]">
      <div class="flex justify-between">
        <span>Core 0 (Vision)</span>
        <span class="text-[#1D1D1F] font-medium">12 FPS</span>
      </div>
      <div class="flex justify-between">
        <span>Core 1 (LEDC)</span>
        <span id="hud-core1" class="text-emerald-700 font-semibold">50 Hz ACTIVE</span>
      </div>
    </div>
  </div>

  <!-- ==================== DEBUG SAFETY BANNER (BUILD MODE + DEBUG ONLY) ==================== -->
  <div id="debug-banner" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-30 px-4 py-2 rounded-full bg-red-50/95 backdrop-blur-xl border border-red-200 text-red-700 text-[11px] font-medium shadow-sm flex items-center gap-2 max-w-[92vw] text-center">
    <span class="w-2 h-2 rounded-full bg-red-500 shrink-0 animate-pulse"></span>
    <span id="debug-banner-text"></span>
  </div>

  <!-- ==================== RIGHT FLOATING INSPECTOR CARD (SLIDES IN WHEN ACTIVE) ==================== -->
  <aside id="right-drawer" class="drawer-hidden fixed top-16 right-4 sm:right-6 bottom-24 z-30 w-[calc(100vw-2rem)] max-w-[365px] glass-panel rounded-2xl flex flex-col overflow-hidden">
    <div class="px-5 py-3.5 border-b border-black/[0.07] flex items-center justify-between shrink-0">
      <div class="min-w-0">
        <div id="drawer-kicker" class="text-[10px] font-semibold uppercase tracking-wider text-[#86868B] hidden"></div>
        <h2 id="drawer-title" class="text-[15px] font-semibold tracking-[-0.015em] text-[#1D1D1F] truncate"></h2>
      </div>
      <button id="btn-close-drawer" type="button" aria-label="Close" class="w-7 h-7 rounded-full bg-black/[0.05] hover:bg-black/[0.1] text-[#6E6E73] hover:text-[#1D1D1F] flex items-center justify-center text-base leading-none transition shrink-0">
        &times;
      </button>
    </div>
    <div id="drawer-body" class="flex-1 overflow-y-auto apple-scroll px-5 py-4 space-y-4 text-[13px] text-[#1D1D1F]"></div>
  </aside>

  <!-- ==================== BOTTOM-CENTER FLOATING DOCK (APPLE GLASS PILL) ==================== -->
  <nav id="floating-dock" aria-label="Controls" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-30 glass-pill rounded-full p-1.5 flex items-center gap-1 max-w-[96vw] overflow-x-auto">
    <button id="dock-view3d" data-panel="view3d" type="button" class="dock-btn px-3.5 py-1.5 rounded-full text-[12px] font-medium transition-all whitespace-nowrap"></button>
    <button id="dock-sim" data-panel="sim" type="button" class="dock-btn px-3.5 py-1.5 rounded-full text-[12px] font-medium transition-all whitespace-nowrap"></button>
    <button id="dock-hardware" data-panel="hardware" type="button" class="dock-btn px-3.5 py-1.5 rounded-full text-[12px] font-medium transition-all whitespace-nowrap"></button>
    <button id="dock-theory" data-panel="theory" type="button" class="dock-btn px-3.5 py-1.5 rounded-full text-[12px] font-medium transition-all whitespace-nowrap"></button>
    <!-- Strictly Build Mode ONLY -->
    <div id="dock-build-sep" class="hidden w-px h-4 bg-black/[0.12] mx-1 shrink-0"></div>
    <button id="dock-wiring" data-panel="wiring" type="button" class="hidden dock-btn px-3.5 py-1.5 rounded-full text-[12px] font-medium transition-all whitespace-nowrap"></button>
    <button id="dock-wokwi" data-panel="wokwi" type="button" class="hidden dock-btn px-3.5 py-1.5 rounded-full text-[12px] font-medium transition-all whitespace-nowrap"></button>
  </nav>

  <!-- ==================== MAIN APPLICATION SCRIPT ==================== -->

      function createBreadboardTopTexture() {
        const c = document.createElement('canvas');
        c.width = 1024; c.height = 688;
        const ctx = c.getContext('2d');

        // Clean white ABS breadboard surface
        ctx.fillStyle = '#F9FAFB';
        ctx.fillRect(0, 0, 1024, 688);

        // Subtle border molding
        ctx.strokeStyle = '#E5E7EB';
        ctx.lineWidth = 6;
        ctx.strokeRect(3, 3, 1018, 682);

        // Helper mapping local breadboard mm (x: -41..41, y: -27.5..27.5 where +Y is front/top on canvas)
        const mx = (xMm) => ((xMm + BB_W / 2) / BB_W) * 1024;
        const my = (yMm) => ((BB_D / 2 - yMm) / BB_D) * 688;

        // Center divider trench
        ctx.fillStyle = '#E5E7EB';
        ctx.fillRect(0, my(1.5), 1024, my(-1.5) - my(1.5));

        // Red (+) and Blue (-) rail stripes (front & rear)
        const drawRailStripe = (yMm, color) => {
          ctx.fillStyle = color;
          ctx.fillRect(mx(-38.5), my(yMm) - 2.5, mx(38.5) - mx(-38.5), 5);
        };
        drawRailStripe( 25.0, '#EF4444'); // Front +
        drawRailStripe( 17.8, '#2563EB'); // Front -
        drawRailStripe(-17.8, '#EF4444'); // Rear +
        drawRailStripe(-25.0, '#2563EB'); // Rear -

        // + and - symbols
        ctx.font = '700 20px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#EF4444';
        ctx.fillText('+', mx(-39.6), my(23.0) + 7);
        ctx.fillText('+', mx( 39.6), my(23.0) + 7);
        ctx.fillStyle = '#2563EB';
        ctx.fillText('−', mx(-39.6), my(20.0) + 7);
        ctx.fillText('−', mx( 39.6), my(20.0) + 7);

        // Draw crisp tie-point square holes
        const drawHole = (xMm, yMm, highlight = null) => {
          const px = mx(xMm), py = my(yMm);
          if (highlight) {
            ctx.fillStyle = highlight;
            ctx.fillRect(px - 6.5, py - 6.5, 13, 13);
          }
          ctx.fillStyle = '#374151';
          ctx.fillRect(px - 4.2, py - 4.2, 8.4, 8.4);
          ctx.fillStyle = '#111827';
          ctx.fillRect(px - 2.5, py - 2.5, 5.0, 5.0);
        };

        // Power rails (5 groups of 5 holes like standard 400-pt breadboard)
        for (let col = 1; col <= 30; col++) {
          if (col % 6 === 0) continue; // Authentic 5-hole power rail grouping
          const x = bbColX(col);
          drawHole(x,  23.0);
          drawHole(x,  20.0);
          drawHole(x, -20.0);
          drawHole(x, -23.0);
        }

        // Main matrix: 30 columns x rows a-e and f-j
        const rowYs = [13.5, 10.96, 8.42, 5.88, 3.34, -3.34, -5.88, -8.42, -10.96, -13.5];
        for (let col = 1; col <= 30; col++) {
          const x = bbColX(col);
          const colTint = col === 8 ? 'rgba(249,115,22,0.22)'
                        : col === 14 ? 'rgba(234,179,8,0.25)'
                        : col === 20 ? 'rgba(139,92,246,0.22)' : null;
          rowYs.forEach((ry, idx) => {
            drawHole(x, ry, idx < 5 ? colTint : null);
          });
          if (col === 1 || col % 5 === 0) {
            ctx.fillStyle = '#9CA3AF';
            ctx.font = '600 13px JetBrains Mono, monospace';
            ctx.fillText(String(col), mx(x), my(15.4));
            ctx.fillText(String(col), mx(x), my(-16.2));
          }
        }

        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        tex.anisotropy = 8;
        return tex;
      }

      function createRoundedRectGeo(w, h, r, depth) {
        const s = new THREE.Shape();
        const x = -w / 2, y = -h / 2;
        s.moveTo(x + r, y);
        s.lineTo(x + w - r, y);
        s.quadraticCurveTo(x + w, y, x + w, y + r);
        s.lineTo(x + w, y + h - r);
        s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        s.lineTo(x + r, y + h);
        s.quadraticCurveTo(x, y + h, x, y + h - r);
        s.lineTo(x, y + r);
        s.quadraticCurveTo(x, y, x + r, y);
        return new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: 0.35, bevelSize: 0.35, bevelSegments: 2, curveSegments: 18 });
      }

      function addBox(parent, w, d, h, x, y, z, mat, shadow = true) {

      // Exact Spherical Lune Eyelid Shell (R_in=33.7, R_out=36.1)
      function createEyelidShellGeometry(rIn, rOut, alphaMaxDeg = 115, segA = 30, segB = 42) {
        const positions = [];
        const indices = [];
        const aMax = alphaMaxDeg * DEG;

        function pushRing(r, aVal) {
          const base = positions.length / 3;
          for (let j = 0; j <= segB; j++) {
            const b = (j / segB) * Math.PI;
            positions.push(
              r * Math.cos(b),
              r * Math.sin(b) * Math.cos(aVal),
              r * Math.sin(b) * Math.sin(aVal)
            );
          }
          return base;
        }

        const outerStarts = [], innerStarts = [];
        for (let i = 0; i <= segA; i++) {
          outerStarts.push(pushRing(rOut, (i / segA) * aMax));
          innerStarts.push(pushRing(rIn,  (i / segA) * aMax));
        }
        for (let i = 0; i < segA; i++) {
          for (let j = 0; j < segB; j++) {
            const a = outerStarts[i] + j, b = outerStarts[i + 1] + j;
            const c = outerStarts[i + 1] + j + 1, d = outerStarts[i] + j + 1;
            indices.push(a, d, b, b, d, c);
            const ia = innerStarts[i] + j, ib = innerStarts[i + 1] + j;
            const ic = innerStarts[i + 1] + j + 1, id = innerStarts[i] + j + 1;
            indices.push(ia, ib, id, ib, ic, id);
          }
        }
        for (let j = 0; j < segB; j++) {
          const o1 = outerStarts[0] + j, o2 = outerStarts[0] + j + 1;
          const i1 = innerStarts[0] + j, i2 = innerStarts[0] + j + 1;
          indices.push(o1, i1, o2, o2, i1, i2);
          const ro1 = outerStarts[segA] + j, ro2 = outerStarts[segA] + j + 1;
          const ri1 = innerStarts[segA] + j, ri2 = innerStarts[segA] + j + 1;
          indices.push(ro1, ro2, ri1, ro2, ri2, ri1);
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.setIndex(indices);
        geo.computeVertexNormals();
        return geo;
      }

      // Stainless Steel Bolt Assembly (+ Optional Nyloc Nut & Washers)
      function createBoltAssembly(axis, diam, len, hasNyloc = false, washers = 0) {
        const g = new THREE.Group();
        const r = diam / 2;
        const headR = diam * 0.86;
        const headH = diam * 0.88;
        const inner = new THREE.Group();

        addCylZ(inner, headR, headH, 0, 0, -headH / 2, matSteel, 18);
        addCylZ(inner, r * 0.72, 0.6, 0, 0, -headH - 0.1, matBlackMatte, 6);
        addCylZ(inner, r, len, 0, 0, len / 2, matSteel, 16);

        if (washers > 0) addCylZ(inner, headR * 1.15, 0.8, 0, 0, 0.4, matSteel, 18);
        if (washers > 1) addCylZ(inner, headR * 1.15, 0.8, 0, 0, len - 3.6, matSteel, 18);
        if (hasNyloc) {
          const nut = new THREE.Mesh(new THREE.CylinderGeometry(headR * 1.05, headR * 1.05, diam * 0.95, 6), matSteel);
          nut.rotation.x = Math.PI / 2;
          nut.position.set(0, 0, len - 2.0);
          inner.add(nut);
          addCylZ(inner, r * 1.35, 0.9, 0, 0, len - 0.5, matNylocBlue, 14);
        }

        if (axis === 'X') inner.rotation.y = Math.PI / 2;
        else if (axis === 'Y') inner.rotation.x = -Math.PI / 2;
        g.add(inner);
        return g;
      }

        const mesh = new THREE.Mesh(geo, entry.mat);
        oscRoot.add(mesh);
        entry.mesh = mesh;
      }

      // Helper for breadboard tie-point coordinate
      function bbPin(col, rowKey, zLift = 0) {
        return new THREE.Vector3(bbColX(col), BB_ROW_Y[rowKey], BB_H + zLift);
      }

      // --- STATIC ZERO-OVERLAP WIRE LANES ---
      // 1) Adapter DC Cord -> Male Barrel Plug
      setWireCurve('dc_cord', [
        new THREE.Vector3(112.0, -71.0, 12.0),
        new THREE.Vector3(110.0, -54.0,  7.0),
        new THREE.Vector3( 88.0, -96.0,  4.5),
        new THREE.Vector3( 66.0, -118.0, 5.5),
        new THREE.Vector3( 58.0, -112.0, 6.0)
      ], 36);

      // 2) Jack DC Screw Terminal -> Breadboard +5V & GND Rails (Col 29)
      setWireCurve('dc_5v', [
        dcTermPlusOsc,
        new THREE.Vector3(46.0, -64.0, 12.0),
        bbPin(29, 'railPlus', 7.5),
        bbPin(29, 'railPlus', 0.0)
      ], 22);
      setWireCurve('dc_gnd', [
        dcTermMinusOsc,
        new THREE.Vector3(52.0, -71.5, 13.5),
        bbPin(29, 'railMinus', 9.0),
        bbPin(29, 'railMinus', 0.0)
      ], 22);

      // 3) 5× ESP32-S3-CAM M-to-F Jumpers (spaced laterally X = -8.5, -4.5, -0.5, +4.5, +8.5 inside pedestal tunnel!)
      setWireCurve('esp_pan_sig', [
        bbPin(8, 'a', 0.0),
        bbPin(8, 'a', 7.0),
        new THREE.Vector3(-12.0, -58.0, 11.5),
        new THREE.Vector3( -8.5, -18.0,  9.0),
        new THREE.Vector3( -8.5,  21.0,  9.5),
        new THREE.Vector3(-10.5,  36.0, 35.0),
        pEspG1
      ], 34);

      setWireCurve('esp_tilt_sig', [
        bbPin(14, 'a', 0.0),
        bbPin(14, 'a', 7.0),
        new THREE.Vector3( -4.5, -58.0, 11.5),
        new THREE.Vector3( -4.5, -18.0,  9.0),
        new THREE.Vector3( -4.5,  21.0,  9.5),
        new THREE.Vector3( -9.5,  36.0, 26.0),
        pEspG14
      ], 34);

      setWireCurve('esp_lid_sig', [
        bbPin(20, 'a', 0.0),
        bbPin(20, 'a', 7.0),
        new THREE.Vector3(  0.0, -58.0, 11.5),
        new THREE.Vector3( -0.5, -18.0,  9.0),
        new THREE.Vector3( -0.5,  21.0,  9.5),
        new THREE.Vector3( -8.5,  36.0, 18.0),
        pEspG21
      ], 34);

      setWireCurve('esp_gnd', [
        bbPin(4, 'railMinus', 0.0),
        bbPin(4, 'railMinus', 8.0),
        new THREE.Vector3(  4.5, -58.0,  8.0),
        new THREE.Vector3(  4.5, -18.0,  7.5),
        new THREE.Vector3(  4.5,  21.0,  8.0),
        new THREE.Vector3(  9.0,  36.0, 20.5),
        pEspGND
      ], 34);

      setWireCurve('esp_5v', [
        bbPin(2, 'railPlus', 0.0),
        bbPin(2, 'railPlus', 8.0),
        new THREE.Vector3(  8.5, -58.0,  8.0),
        new THREE.Vector3(  8.5, -18.0,  7.5),
        new THREE.Vector3(  8.5,  21.0,  8.0),
        new THREE.Vector3( 11.5,  36.0, 15.0),
        pEsp5V
      ], 34);

      // 4) Pan Servo 3× M-to-M Jumpers (exits Pan servo inside upper cavity Z=24.8 -> drops cleanly to Breadboard)
      setWireCurve('pan_5v', [
        new THREE.Vector3(18.0, -2.0, 24.8),
        new THREE.Vector3(14.0, -28.0, 21.0),
        new THREE.Vector3(-12.0, -56.0, 18.0),
        bbPin(10, 'railPlus', 9.0),
        bbPin(10, 'railPlus', 0.0)
      ], 28);
      setWireCurve('pan_gnd', [
        new THREE.Vector3(18.0,  0.0, 24.8),
        new THREE.Vector3(11.0, -29.0, 20.0),
        new THREE.Vector3(-14.5, -58.0, 17.5),
        bbPin(10, 'railMinus', 9.0),
        bbPin(10, 'railMinus', 0.0)
      ], 28);
      setWireCurve('pan_sig', [
        new THREE.Vector3(18.0,  2.0, 24.8),
        new THREE.Vector3( 8.0, -30.0, 22.5),
        new THREE.Vector3(-18.5, -62.0, 20.0),
        bbPin(8, 'e', 9.0),
        bbPin(8, 'e', 0.0)
      ], 28);

      // 5) Sleek Apple-White USB-C Data Cable (Visible ONLY in Build Mode + Debug Power)
      const usbCableMat = new THREE.MeshStandardMaterial({ color: 0xF3F4F6, roughness: 0.35, metalness: 0.05 });
      const usbGroup = new THREE.Group();
      addBox(usbGroup, 9.6, 5.2, 12.0, pEspUART.x, pEspUART.y + 0.5, pEspUART.z - 4.5, usbCableMat);
      const usbCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(pEspUART.x, pEspUART.y + 0.5, pEspUART.z - 10.0),
        new THREE.Vector3(pEspUART.x + 4, pEspUART.y + 18, 4.5),
        new THREE.Vector3(pEspUART.x + 32, pEspUART.y + 44, 3.0),
        new THREE.Vector3(pEspUART.x + 82, pEspUART.y + 52, 2.5)
      ]);
      usbGroup.add(new THREE.Mesh(new THREE.TubeGeometry(usbCurve, 32, 1.9, 10, false), usbCableMat));
      usbGroup.visible = false;
      oscRoot.add(usbGroup);

      // --- DYNAMIC KINEMATIC WIRE HARNESSES FOR TILT & EYELID SERVOS ---
      let lastWirePan = 999, lastWireTilt = 999, lastWireExp = 999;
      function updateDynamicHarnesses(force = false) {
        if (!force &&
            Math.abs(currPan - lastWirePan) < 0.25 &&
            Math.abs(currTilt - lastWireTilt) < 0.25 &&
            Math.abs(explodeAnim - lastWireExp) < 0.008) {
          return;
        }
        lastWirePan = currPan;
        lastWireTilt = currTilt;
        lastWireExp = explodeAnim;

        // TILT SERVO HARNESS (down right Pan Fork arm -> right side rear -> Breadboard Col 14/16)
        const tiltLanes = [
          { id: 'tilt_5v',  dy: -2.0, col: 16, row: 'railPlus',  sx: 18.0 },
          { id: 'tilt_gnd', dy:  0.0, col: 16, row: 'railMinus', sx: 20.5 },
          { id: 'tilt_sig', dy:  2.0, col: 14, row: 'e',         sx: 23.0 }
        ];
        tiltLanes.forEach((lane, idx) => {
          const pOut    = localToOsc(tiltServoGroup, new THREE.Vector3(18.0, lane.dy, -13.2));
          const pForkHi = localToOsc(forkGroup, new THREE.Vector3(48.5, -8.5 + lane.dy * 0.9, 44.0));
          const pForkLo = localToOsc(forkGroup, new THREE.Vector3(48.5, -8.5 + lane.dy * 0.9, 16.0));
          const pForkBs = localToOsc(forkGroup, new THREE.Vector3(24.0 + idx * 2.2, -12.0, 2.0));
          const pSlack  = new THREE.Vector3(lane.sx, -48.0, 30.0 - idx * 2.0);
          setWireCurve(lane.id, [
            pOut, pForkHi, pForkLo, pForkBs, pSlack,
            bbPin(lane.col, lane.row, 11.0),
            bbPin(lane.col, lane.row, 0.0)
          ], 32);
        });

        // EYELID SERVO HARNESS (behind Tilt Cradle right -> clean slack arc behind pedestal -> Breadboard Col 20/22)
        const lidLanes = [
          { id: 'lid_5v',  dy: -2.0, col: 22, row: 'railPlus',  sx:  8.5 },
          { id: 'lid_gnd', dy:  0.0, col: 22, row: 'railMinus', sx: 11.0 },
          { id: 'lid_sig', dy:  2.0, col: 20, row: 'e',         sx: 13.5 }
        ];
        lidLanes.forEach((lane, idx) => {
          const pOut   = localToOsc(eyelidServoGroup, new THREE.Vector3(18.0, lane.dy, -13.2));
          const pBarL  = localToOsc(cradleGroup, new THREE.Vector3(-12.0, -45.0 - idx * 2.1, -4.0));
          const pBarR  = localToOsc(cradleGroup, new THREE.Vector3( 14.0 + idx * 2.2, -45.0 - idx * 2.1, -5.5));
          const pSlack = new THREE.Vector3(lane.sx, -56.0 - idx * 2.0, 44.0 - idx * 2.2);
          setWireCurve(lane.id, [
            pOut, pBarL, pBarR, pSlack,
            bbPin(lane.col, lane.row, 12.0),
            bbPin(lane.col, lane.row, 0.0)
          ], 32);
        });
      }

      // Animated Glowing Pulses along Highlighted Wires
      const pulseGroup = new THREE.Group();
      oscRoot.add(pulseGroup);
      const pulsePool = [];
      const pulseGeo = new THREE.SphereGeometry(1.75, 12, 12);
      for (let i = 0; i < 48; i++) {
        const m = new THREE.Mesh(
          pulseGeo,
          new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.95 })
        );
        m.visible = false;
        pulseGroup.add(m);
        pulsePool.push(m);
      }

      function updatePulseParticles(timeSec) {
        const activeIds = highlightedWireIds;
        if (!activeIds || activeIds.length === 0) {
          pulsePool.forEach(p => (p.visible = false));
          return;
        }
        let idx = 0;
        const perWire = Math.max(1, Math.min(3, Math.floor(pulsePool.length / activeIds.length)));
        activeIds.forEach(wid => {
          const entry = wireStore[wid];
          if (!entry || !entry.curve) return;
          if (wid === 'esp_5v' && isDebugMode) return;
          for (let k = 0; k < perWire && idx < pulsePool.length; k++) {
            const p = pulsePool[idx++];
            const t = (timeSec * 0.45 + k / perWire) % 1.0;
            p.position.copy(entry.curve.getPointAt(t));
            p.material.color.setHex(entry.meta.color === 0x1F2937 || entry.meta.color === 0x1E293B ? 0x38BDF8 : 0xFFFFFF);
            p.visible = true;
          }
        });
        while (idx < pulsePool.length) pulsePool[idx++].visible = false;
      }

      // =====================================================================
      // 9. APPLICATION STATE (DEFAULT: PRESENTATION MODE, ID, FULL-BLEED 3D)
      // =====================================================================
      let appLang = 'id';           // 'id' | 'en'
      let appMode = 'present';      // 'present' (DEFAULT) | 'build'
      let activePanel = null;       // null | 'view3d' | 'sim' | 'hardware' | 'theory' | 'wiring' | 'wokwi' | 'inspect'
      let inspectedCompId = null;
      let highlightedWireIds = null;

      let userXray = false;
      let autoGhostPLA = false;
      let explodeTarget = 0;
      let explodeAnim = 0;
      let isDebugMode = false;

      // Simulation State
      let simActive = false;
      let simPreset = 'auto';       // 'auto' | 'noface' | 'sleep'
      let simDistanceCm = 48;
      let simBehavior = 'TRACKING';
      let isJudgmentalLocked = false;
      let cursorNormX = 0, cursorNormY = 0;
      let lastCursorMoveMs = performance.now();
      let isOrbitDragging = false;

      let currPan = 0, currTilt = 0, currLid = 0;
      let targetPan = 0, targetTilt = 0, targetLid = 0;
      let blinkTimer = 0, nextBlinkDelay = 4.6, blinkProgress = -1;
      let idleTimer = 0, idlePan = 0, idleTilt = 0;
      let microTimer = 0, microPan = 0, microTilt = 0;
      let lastParallaxDeg = 0;

      // Wokwi 2D State
      let wokwiScale = 1.0;
      let wokwiPanX = 0, wokwiPanY = 0;
      let wokwiActiveNet = null; // null | 'rail_5v' | 'rail_gnd' | 'col_8' | 'col_14' | 'col_20'

      // Smooth Camera Transitions
      let camTargetPos = null, camTargetLook = null;
      function focusCamera(posArr, lookArr) {
        camTargetPos = new THREE.Vector3(...posArr);
        camTargetLook = new THREE.Vector3(...lookArr);
      }
      controls.addEventListener('start', () => { camTargetPos = null; camTargetLook = null; });

      // =====================================================================
      // 10. PLA X-RAY GHOSTING & WIRE HIGHLIGHT ENGINE
      // =====================================================================
      function updatePLAOpacity() {
        const ghost = userXray || autoGhostPLA;
        plaMaterialList.forEach(mat => {
          if (ghost) {
            mat.transparent = true;
            mat.opacity = 0.18;
            mat.depthWrite = false;
          } else {
            mat.transparent = false;
            mat.opacity = 1.0;
            mat.depthWrite = true;
          }
          mat.needsUpdate = true;
        });
      }

      function applyWireVisualState() {
        WIRE_META.forEach(meta => {
          const entry = wireStore[meta.id];
          if (!entry) return;
          const isHighlighted = highlightedWireIds && highlightedWireIds.includes(meta.id);
          const isAnyHighlight = highlightedWireIds && highlightedWireIds.length > 0;

          // Physically HIDE Red +5V jumper to ESP32 in Debug Mode!
          if (meta.id === 'esp_5v' && isDebugMode) {
            if (entry.mesh) entry.mesh.visible = false;
            return;
          } else if (entry.mesh) {
            entry.mesh.visible = true;
          }

          if (!isAnyHighlight) {
            entry.mat.opacity = 1.0;
            entry.mat.emissiveIntensity = 0.04;
          } else if (isHighlighted) {
            entry.mat.opacity = 1.0;
            entry.mat.emissiveIntensity = 0.58;
          } else {
            entry.mat.opacity = 0.11;
            entry.mat.emissiveIntensity = 0.0;
          }
        });

        usbGroup.visible = (appMode === 'build' && isDebugMode);
        document.getElementById('debug-banner').classList.toggle(
          'hidden',
          !(appMode === 'build' && isDebugMode && activePanel !== 'wokwi')
        );
      }

      function highlightComponent(compId, openInspector = true) {
        inspectedCompId = compId;
        if (!compId) {
          highlightedWireIds = null;
          autoGhostPLA = false;
          updatePLAOpacity();
          applyWireVisualState();
          return;
        }
        const connected = WIRE_META.filter(m => m.comps.includes(compId)).map(m => m.id);
        highlightedWireIds = connected.length > 0 ? connected : null;
        autoGhostPLA = (compId !== 'adapter' && compId !== 'jack_dc' && compId !== 'breadboard' && compId !== 'elko');
        updatePLAOpacity();
        applyWireVisualState();

        if (compId === 'pan_servo')           focusCamera([125, 118, 225], [0, 48, 30]);
        else if (compId === 'tilt_servo')     focusCamera([190, 145, -95], [22, 98, 12]);
        else if (compId === 'eyelid_servo')   focusCamera([-165, 148, 130], [-16, 102, 32]);
        else if (compId === 'esp32')          focusCamera([108, 115, 185], [0, 56, -24]);
        else if (compId === 'breadboard' || compId === 'elko') focusCamera([-55, 135, 250], [5, 25, 88]);
        else if (compId === 'jack_dc' || compId === 'adapter') focusCamera([165, 130, 245], [58, 22, 85]);

        if (openInspector) {
          hideWokwiOverlay();
          activePanel = 'inspect';
          drawerEl.classList.remove('drawer-hidden');
          renderDrawer();
          syncDockUI();
        }
      }

      function highlightSingleWire(wireId) {
        inspectedCompId = null;
        if (!wireId) {
          highlightedWireIds = null;
          autoGhostPLA = false;
        } else {
          highlightedWireIds = [wireId];
          autoGhostPLA = true;
        }
        updatePLAOpacity();
        applyWireVisualState();
      }

      function clearInspection() {
        inspectedCompId = null;
        highlightedWireIds = null;
        autoGhostPLA = false;
        updatePLAOpacity();
        applyWireVisualState();
      }

      // =====================================================================
      // 11. DIRECT 3D RAYCASTING & SHIFT+SCROLL DISTANCE
      // =====================================================================
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();
      let downX = 0, downY = 0;

      renderer.domElement.addEventListener('pointerdown', (e) => {
        downX = e.clientX; downY = e.clientY;
        isOrbitDragging = true;
      });
      window.addEventListener('pointerup', (e) => {
        isOrbitDragging = false;
        const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
        if (dist > 6 || e.target !== renderer.domElement) return;

        const rect = renderer.domElement.getBoundingClientRect();
        pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects(clickableMeshes, false);

        if (hits.length > 0 && hits[0].object.userData.compId) {
          highlightComponent(hits[0].object.userData.compId, true);
        } else if (activePanel === 'inspect') {
          clearInspection();
          closeDrawer();
        } else if (highlightedWireIds) {
          clearInspection();
          if (activePanel === 'wiring') renderDrawer();
        }
      });

      renderer.domElement.addEventListener('pointermove', (e) => {
        const rect = renderer.domElement.getBoundingClientRect();
        const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        const ny = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        if (simActive && !isOrbitDragging) {
          cursorNormX = Math.max(-1, Math.min(1, nx));
          cursorNormY = Math.max(-1, Math.min(1, ny));
          lastCursorMoveMs = performance.now();
          if (simPreset === 'sleep') {
            simPreset = 'auto';
            if (activePanel === 'sim') renderDrawer();
          }
          hoverTooltip.style.opacity = '0';
          return;
        }
        if (isOrbitDragging) {
          hoverTooltip.style.opacity = '0';
          return;
        }

        pointerNDC.set(nx, ny);
        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects(clickableMeshes, false);
        if (hits.length > 0 && hits[0].object.userData.compId) {
          const cid = hits[0].object.userData.compId;
          const compInfo = I18N[appLang].comps[cid];
          renderer.domElement.style.cursor = 'pointer';
          hoverTooltip.textContent = compInfo ? compInfo.name : cid;
          hoverTooltip.style.left = `${e.clientX + 14}px`;
          hoverTooltip.style.top  = `${e.clientY - 12}px`;
          hoverTooltip.style.opacity = '1';
        } else {
          renderer.domElement.style.cursor = 'grab';
          hoverTooltip.style.opacity = '0';
        }
      });

      renderer.domElement.addEventListener('pointerleave', () => {
        hoverTooltip.style.opacity = '0';
      });

      // Hold Shift + mouse wheel in Simulation to smoothly vary visitor distance
      renderer.domElement.addEventListener('wheel', (e) => {
        if (simActive && e.shiftKey) {
          e.preventDefault();
          simPreset = 'auto';
          simDistanceCm = Math.max(15, Math.min(120, Math.round(simDistanceCm + Math.sign(e.deltaY) * 4)));
          const ds = document.getElementById('drawer-dist-slider');
          const dv = document.getElementById('drawer-dist-val');
          if (ds) ds.value = simDistanceCm;
          if (dv) dv.textContent = `${simDistanceCm} cm`;
        }
      }, { passive: false });

      // =====================================================================
      // 12. INTERACTIVE 2D WOKWI-STYLE ELECTRICAL SCHEMATIC ENGINE
      // =====================================================================
      const wokwiOverlay = document.getElementById('wokwi-overlay');
      const wokwiSvgWrap = document.getElementById('wokwi-svg-wrap');
      const wokwiViewport = document.getElementById('wokwi-viewport');

      function showWokwiOverlay() {
        if (appMode !== 'build') return;
        setSimulationActive(false);
        drawerEl.classList.add('drawer-hidden');
        wokwiOverlay.classList.remove('hidden');
        renderWokwiSVG();
        updateWokwiNetCard(wokwiActiveNet);
        applyWireVisualState();
      }

      function hideWokwiOverlay() {
        wokwiOverlay.classList.add('hidden');
        hoverTooltip.style.opacity = '0';
      }

      function applyWokwiTransform() {
        wokwiSvgWrap.style.transform = `translate(${wokwiPanX}px, ${wokwiPanY}px) scale(${wokwiScale})`;
        document.getElementById('wokwi-zoom-pct').textContent = `${Math.round(wokwiScale * 100)}%`;
      }

      // Pan & zoom inside 2D Wokwi canvas
      let wkDragging = false, wkStartX = 0, wkStartY = 0;
      wokwiViewport.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.wokwi-wire, .wokwi-comp, [data-net], [data-pin-tip]')) return;
        wkDragging = true;
        wkStartX = e.clientX - wokwiPanX;
        wkStartY = e.clientY - wokwiPanY;
      });
      window.addEventListener('pointermove', (e) => {
        if (!wkDragging) return;
        wokwiPanX = e.clientX - wkStartX;
        wokwiPanY = e.clientY - wkStartY;
        applyWokwiTransform();
      });
      window.addEventListener('pointerup', () => { wkDragging = false; });
      wokwiViewport.addEventListener('wheel', (e) => {
        if (wokwiOverlay.classList.contains('hidden')) return;
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        wokwiScale = Math.max(0.65, Math.min(2.2, +(wokwiScale + delta).toFixed(2)));
        applyWokwiTransform();
      }, { passive: false });

      document.getElementById('wokwi-zoom-in').addEventListener('click', () => {
        wokwiScale = Math.min(2.2, +(wokwiScale + 0.15).toFixed(2));
        applyWokwiTransform();
      });
      document.getElementById('wokwi-zoom-out').addEventListener('click', () => {
        wokwiScale = Math.max(0.65, +(wokwiScale - 0.15).toFixed(2));
        applyWokwiTransform();
      });
      document.getElementById('wokwi-zoom-reset').addEventListener('click', () => {
        wokwiScale = 1.0; wokwiPanX = 0; wokwiPanY = 0;
        applyWokwiTransform();
      });
      document.getElementById('wokwi-mode-demo').addEventListener('click', () => {
        isDebugMode = false;
        applyWireVisualState();
        renderWokwiSVG();
        updateWokwiNetCard(wokwiActiveNet);
        syncWokwiTopBar();
      });
      document.getElementById('wokwi-mode-debug').addEventListener('click', () => {
        isDebugMode = true;
        applyWireVisualState();
        renderWokwiSVG();
        updateWokwiNetCard(wokwiActiveNet);
        syncWokwiTopBar();
      });
      document.getElementById('wokwi-net-clear').addEventListener('click', () => {
        wokwiActiveNet = null;
        highlightWokwiNet(null);
        updateWokwiNetCard(null);
      });

      function syncWokwiTopBar() {
        const t = I18N[appLang];
        const bDemo  = document.getElementById('wokwi-mode-demo');
        const bDebug = document.getElementById('wokwi-mode-debug');
        bDemo.textContent  = t.wrDemoBtn;
        bDebug.textContent = t.wrDebugBtn;
        bDemo.className  = !isDebugMode ? 'px-3 py-1 rounded-full bg-[#1D1D1F] text-white transition whitespace-nowrap' : 'px-3 py-1 rounded-full text-[#6E6E73] hover:text-[#1D1D1F] transition whitespace-nowrap';
        bDebug.className =  isDebugMode ? 'px-3 py-1 rounded-full bg-red-600 text-white transition whitespace-nowrap'    : 'px-3 py-1 rounded-full text-[#6E6E73] hover:text-[#1D1D1F] transition whitespace-nowrap';
        document.getElementById('wokwi-zoom-reset').textContent = t.wkReset;
        document.getElementById('wokwi-net-clear').textContent  = t.wkClear;
      }

      function updateWokwiNetCard(netId, customWireId = null) {
        const t = I18N[appLang];
        const dotEl   = document.getElementById('wokwi-net-dot');
        const titleEl = document.getElementById('wokwi-net-title');
        const bodyEl  = document.getElementById('wokwi-net-body');
        const clrBtn  = document.getElementById('wokwi-net-clear');

          rail_5v: '#EF4444', rail_gnd: '#1E293B',
          col_8: '#F97316', col_14: '#EAB308', col_20: '#8B5CF6'
        };
        dotEl.style.background = colorMap[netId] || '#10B981';
        titleEl.textContent = info ? info.title : netId;

        const netWires = WIRE_META.filter(w => w.net === netId);
        const listHTML = netWires.map(w => {
          const isRemoved = (w.id === 'esp_5v' && isDebugMode);
          return `
            <div class="flex items-center justify-between gap-2 px-2 py-1 rounded-lg ${isRemoved ? 'bg-red-50 text-red-700 line-through' : 'bg-black/[0.03] text-[#1D1D1F]'}">

      function highlightWokwiNet(netId) {
        const svg = wokwiSvgWrap.querySelector('svg');
        if (!svg) return;
        // Highlight internal emerald copper strips on breadboard (authentic Wokwi behavior!)
        svg.querySelectorAll('.wokwi-strip-highlight').forEach(el => {
          el.setAttribute('opacity', netId && el.dataset.strip === netId ? '0.88' : '0');
        });
        // Highlight matching wires, dim others
        svg.querySelectorAll('.wokwi-wire').forEach(el => {
          const wNet = el.dataset.net;
          if (!netId) {
            el.setAttribute('opacity', el.dataset.removed === '1' ? '0.4' : '1');
            el.classList.remove('wire-flow-anim');
          } else if (wNet === netId) {
            el.setAttribute('opacity', '1');
            if (el.dataset.removed !== '1') el.classList.add('wire-flow-anim');
          } else {
            el.setAttribute('opacity', '0.16');
            el.classList.remove('wire-flow-anim');
          }
        });
      }

      function renderWokwiSVG() {

              <path class="wokwi-wire" data-net="rail_gnd" d="M ${s2.x + 58} ${s2.y + 98} L ${s2.x + 58} 196 L ${colX(15)} 196 L ${colX(15)} ${yRailMinus}" stroke="#5C3A21" stroke-width="3.2"/>
              <path class="wokwi-wire" data-net="rail_5v"  d="M ${s2.x + 77} ${s2.y + 98} L ${s2.x + 77} 184 L ${colX(16)} 184 L ${colX(16)} ${yRailPlus}" stroke="#DC2626" stroke-width="3.2"/>
              <path class="wokwi-wire" data-net="col_14"   d="M ${s2.x + 96} ${s2.y + 98} L ${s2.x + 96} 214 L ${colX(14)} 214 L ${colX(14)} ${rowY.e}" stroke="#EAB308" stroke-width="3.4"/>

              <!-- EYELID SERVO -> Breadboard (GND Col 22, 5V Col 22, SIG e20) -->
              <path class="wokwi-wire" data-net="rail_gnd" d="M ${s3.x + 58} ${s3.y + 98} L ${s3.x + 58} 196 L ${colX(21)} 196 L ${colX(21)} ${yRailMinus}" stroke="#5C3A21" stroke-width="3.2"/>
              <path class="wokwi-wire" data-net="rail_5v"  d="M ${s3.x + 77} ${s3.y + 98} L ${s3.x + 77} 184 L ${colX(22)} 184 L ${colX(22)} ${yRailPlus}" stroke="#DC2626" stroke-width="3.2"/>
              <path class="wokwi-wire" data-net="col_20"   d="M ${s3.x + 96} ${s3.y + 98} L ${s3.x + 96} 214 L ${colX(20)} 214 L ${colX(20)} ${rowY.e}" stroke="#8B5CF6" stroke-width="3.4"/>

              <!-- BREADBOARD -> ESP32-S3 (5x M-to-F Jumpers routed cleanly below/around breadboard) -->
              <!-- 1. +5V (Col 2 Rail+ -> left margin -> ESP32 5V) -->
              <path class="wokwi-wire" data-net="rail_5v" ${esp5vRemovedAttr}
                d="M ${colX(2)} ${yRailPlus} L ${colX(2)} ${by - 16} L ${bx - 30} ${by - 16} L ${bx - 30} 494 L ${p5V_esp.x} 494 L ${p5V_esp.x} ${p5V_esp.y}"
                stroke="#EF4444" stroke-width="3.6"/>

              <!-- 2. Common GND (Col 4 Rail- -> left inner margin -> ESP32 GND) -->
              <path class="wokwi-wire" data-net="rail_gnd" ${gndGlowFilter}
                d="M ${colX(4)} ${yRailMinus} L ${colX(4)} ${by - 6} L ${bx - 16} ${by - 6} L ${bx - 16} 508 L ${pGND_esp.x} 508 L ${pGND_esp.x} ${pGND_esp.y}"
                stroke="${isDebugMode ? '#10B981' : '#1E293B'}" stroke-width="${isDebugMode ? '4.2' : '3.6'}"/>

              <!-- 3. Pan PWM (a8 -> ESP32 GPIO 1) -->
              <path class="wokwi-wire" data-net="col_8"
                d="M ${colX(8)} ${rowY.a} L ${colX(8)} 482 L ${pG1_esp.x} 482 L ${pG1_esp.x} ${pG1_esp.y}"
                stroke="#F97316" stroke-width="3.4"/>

              <!-- 4. Tilt PWM (a14 -> ESP32 GPIO 14) -->
              <path class="wokwi-wire" data-net="col_14"
                d="M ${colX(14)} ${rowY.a} L ${colX(14)} 494 L ${pG14_esp.x} 494 L ${pG14_esp.x} ${pG14_esp.y}"
                stroke="#EAB308" stroke-width="3.4"/>

              <!-- 5. Eyelid PWM (a20 -> ESP32 GPIO 21) -->
              <path class="wokwi-wire" data-net="col_20"
                d="M ${colX(20)} ${rowY.a} L ${colX(20)} 506 L ${pG21_esp.x} 506 L ${pG21_esp.x} ${pG21_esp.y}"
                stroke="#8B5CF6" stroke-width="3.4"/>
            </g>

            <!-- Debug Mode Callout Badges on 2D Schematic -->
            ${isDebugMode ? `
              <g>
                <rect x="34" y="476" width="276" height="24" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
                <text x="172" y="492" text-anchor="middle" font-size="9.5" font-weight="700" fill="#B91C1C" font-family="Inter">✕ ${t.wkDebugRemoved}</text>
                <rect x="34" y="508" width="276" height="24" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
                <text x="172" y="524" text-anchor="middle" font-size="9.5" font-weight="700" fill="#065F46" font-family="Inter">✓ ${t.wkCommonGnd}</text>
              </g>
            ` : ''}
          </svg>
        `;

        // Bind interactive hover & click net highlighting on the 2D SVG
        const svgEl = wokwiSvgWrap.querySelector('svg');
        svgEl.querySelectorAll('[data-net]').forEach(el => {
          el.addEventListener('pointerenter', () => {
            if (!wokwiActiveNet) highlightWokwiNet(el.dataset.net);
          });
          el.addEventListener('pointerleave', () => {
            if (!wokwiActiveNet) highlightWokwiNet(null);
          });
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            const net = el.dataset.net;
            wokwiActiveNet = (wokwiActiveNet === net) ? null : net;
            highlightWokwiNet(wokwiActiveNet);
            updateWokwiNetCard(wokwiActiveNet);
          });
        });

        // Pin reservation tooltips on ESP32-S3
        svgEl.querySelectorAll('[data-pin-tip]').forEach(el => {
          el.addEventListener('pointermove', (e) => {
            hoverTooltip.textContent = el.dataset.pinTip;
            hoverTooltip.style.left = `${e.clientX + 14}px`;
            hoverTooltip.style.top  = `${e.clientY - 12}px`;
            hoverTooltip.style.opacity = '1';
          });
          el.addEventListener('pointerleave', () => {
            hoverTooltip.style.opacity = '0';
          });
        });

        svgEl.addEventListener('click', () => {
          wokwiActiveNet = null;
          highlightWokwiNet(null);
          updateWokwiNetCard(null);
        });

        if (wokwiActiveNet) highlightWokwiNet(wokwiActiveNet);
        applyWokwiTransform();
      }

      // =====================================================================
      // 13. UI RENDERING (TOP PILLS, FLOATING DOCK, RIGHT INSPECTOR DRAWER)
      // =====================================================================
      const drawerEl     = document.getElementById('right-drawer');
      const drawerKicker = document.getElementById('drawer-kicker');
      const drawerTitle  = document.getElementById('drawer-title');
      const drawerBody   = document.getElementById('drawer-body');
      const ov2640Hud    = document.getElementById('ov2640-hud');

      function openPanel(panel) {
        if (panel === 'wokwi') {
          if (appMode !== 'build') return;
          activePanel = 'wokwi';
          showWokwiOverlay();
          syncDockUI();
          return;
        }
        hideWokwiOverlay();
        activePanel = panel;
        drawerEl.classList.remove('drawer-hidden');
        if (panel === 'sim') setSimulationActive(true);
        else if (simActive) setSimulationActive(false);
        renderDrawer();
        syncDockUI();
      }

      function closeDrawer() {
        activePanel = null;
        drawerEl.classList.add('drawer-hidden');
        hideWokwiOverlay();
        if (inspectedCompId) clearInspection();
        syncDockUI();
      }

      function setSimulationActive(active) {
        simActive = active;
        ov2640Hud.classList.toggle('hidden', !active);
        stage.classList.toggle('cursor-sim-active', active);
        if (active) {
          clearInspection();
          focusCamera([-14, 112, -268], [0, 92, 0]);
        }
      }

      function syncTopControlsUI() {
        const t = I18N[appLang];
        const btnPresent = document.getElementById('btn-mode-present');
        const btnBuild   = document.getElementById('btn-mode-build');
        btnPresent.textContent = t.modePresent;
        btnBuild.textContent   = t.modeBuild;

        const mAct = 'px-3 py-1 rounded-full bg-[#1D1D1F] text-white transition-all duration-200';
        const mIdl = 'px-3 py-1 rounded-full text-[#6E6E73] hover:text-[#1D1D1F] transition-all duration-200';
        btnPresent.className = appMode === 'present' ? mAct : mIdl;
        btnBuild.className   = appMode === 'build'   ? mAct : mIdl;

        const lAct = 'px-2.5 py-1 rounded-full bg-[#1D1D1F] text-white transition-all duration-200';
        const lIdl = 'px-2.5 py-1 rounded-full text-[#6E6E73] hover:text-[#1D1D1F] transition-all duration-200';
        document.getElementById('btn-lang-id').className = appLang === 'id' ? lAct : lIdl;
        document.getElementById('btn-lang-en').className = appLang === 'en' ? lAct : lIdl;
        document.getElementById('debug-banner-text').textContent = t.wrDebugBanner;
      }

      function syncDockUI() {
        const t = I18N[appLang];
        document.getElementById('dock-view3d').textContent   = t.dockView3d;
        document.getElementById('dock-sim').textContent      = t.dockSim;
        document.getElementById('dock-hardware').textContent = t.dockHardware;
        document.getElementById('dock-theory').textContent   = t.dockTheory;
        document.getElementById('dock-wiring').textContent   = t.dockWiring;
        document.getElementById('dock-wokwi').textContent    = t.dockWokwi;

        const isBuild = (appMode === 'build');
        document.getElementById('dock-build-sep').classList.toggle('hidden', !isBuild);
        document.getElementById('dock-wiring').classList.toggle('hidden', !isBuild);
        document.getElementById('dock-wokwi').classList.toggle('hidden', !isBuild);

        document.querySelectorAll('.dock-btn').forEach(btn => {
          const p = btn.dataset.panel;
          const hiddenBuild = (p === 'wiring' || p === 'wokwi') && !isBuild;
          const isActive = (activePanel === p) || (p === 'sim' && simActive);
          btn.className = `${hiddenBuild ? 'hidden ' : ''}dock-btn px-3.5 py-1.5 rounded-full text-[12px] font-medium transition-all whitespace-nowrap ${
            isActive ? 'bg-[#1D1D1F] text-white shadow-sm' : 'text-[#6E6E73] hover:text-[#1D1D1F]'
          }`;
        });
      }

      function renderDrawer() {
        if (!activePanel || activePanel === 'wokwi') return;
        const t = I18N[appLang];
        drawerKicker.classList.add('hidden');
        drawerBody.innerHTML = '';

        // --- A. 3D SHOWCASE CONTROLS ---
        if (activePanel === 'view3d') {
          drawerTitle.textContent = t.v3dTitle;
          const expPct = Math.round(explodeTarget * 100);
          drawerBody.innerHTML = `
            <div class="space-y-2">
              <div class="text-[10px] font-semibold uppercase tracking-wider text-[#86868B]">${t.v3dPresets}</div>
              <div class="grid grid-cols-2 gap-1.5">
                <button data-cam="front" class="cam-preset-btn py-2 px-3 rounded-xl bg-white/80 hover:bg-white border border-black/[0.08] text-[12px] font-medium text-[#1D1D1F] transition">${t.v3dFront}</button>
                <button data-cam="iso"   class="cam-preset-btn py-2 px-3 rounded-xl bg-white/80 hover:bg-white border border-black/[0.08] text-[12px] font-medium text-[#1D1D1F] transition">${t.v3dIso}</button>
                <button data-cam="rear"  class="cam-preset-btn py-2 px-3 rounded-xl bg-white/80 hover:bg-white border border-black/[0.08] text-[12px] font-medium text-[#1D1D1F] transition">${t.v3dRear}</button>
                <button data-cam="side"  class="cam-preset-btn py-2 px-3 rounded-xl bg-white/80 hover:bg-white border border-black/[0.08] text-[12px] font-medium text-[#1D1D1F] transition">${t.v3dSide}</button>
              </div>
            </div>

            <div class="rounded-xl bg-black/[0.03] border border-black/[0.06] p-3.5 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-semibold uppercase tracking-wider text-[#6E6E73]">${t.v3dExplode}</span>
                <span id="v3d-exp-val" class="text-[12px] font-mono-tech font-semibold text-[#1D1D1F]">${expPct}%</span>
              </div>
              <input id="v3d-exp-slider" type="range" min="0" max="100" value="${expPct}" class="w-full" />
            </div>

            <div class="rounded-xl bg-white/80 border border-black/[0.07] p-3.5 space-y-2">
              <div class="flex items-center justify-between gap-2">
                <span class="text-[12px] font-semibold text-[#1D1D1F]">${t.v3dXray}</span>
                <button id="v3d-xray-toggle" type="button" class="w-11 h-6 rounded-full p-0.5 transition ${userXray ? 'bg-[#1D1D1F]' : 'bg-black/[0.14]'}">
                  <span class="block w-5 h-5 rounded-full bg-white shadow-sm transition-transform ${userXray ? 'translate-x-5' : 'translate-x-0'}"></span>
                </button>
              </div>
              <p class="text-[11px] text-[#6E6E73] leading-relaxed">${t.v3dXrayDesc}</p>
            </div>

            <button id="v3d-reset-cam" type="button" class="w-full py-2 rounded-xl bg-black/[0.05] hover:bg-black/[0.09] text-[12px] font-medium text-[#1D1D1F] transition">${t.v3dReset}</button>
          `;

          drawerBody.querySelectorAll('.cam-preset-btn').forEach(b => {
            b.addEventListener('click', () => {
              const c = b.dataset.cam;
              if (c === 'front') focusCamera([0, 110, -270], [0, 88, 0]);
              else if (c === 'iso') focusCamera([-148, 138, -285], [0, 74, 14]);
              else if (c === 'rear') focusCamera([-48, 150, 295], [16, 46, 55]);
              else if (c === 'side') focusCamera([-265, 115, -25], [-10, 95, 15]);
            });
          });
          document.getElementById('v3d-exp-slider').addEventListener('input', (e) => {
            const pct = parseInt(e.target.value, 10);
            explodeTarget = pct / 100;
            document.getElementById('v3d-exp-val').textContent = `${pct}%`;
          });
          document.getElementById('v3d-xray-toggle').addEventListener('click', () => {
            userXray = !userXray;
            updatePLAOpacity();
            renderDrawer();
          });
          document.getElementById('v3d-reset-cam').addEventListener('click', () => {
            explodeTarget = 0;
            clearInspection();
            focusCamera([-148, 138, -285], [0, 74, 14]);
            renderDrawer();
          });
        }

        // --- B. SIMULATION PANEL ---
        else if (activePanel === 'sim') {
          drawerTitle.textContent = t.simTitle;
          drawerBody.innerHTML = `
            <p class="text-[12px] text-[#6E6E73] leading-relaxed">${t.simDesc}</p>

            <div class="space-y-2">
              <div class="text-[10px] font-semibold uppercase tracking-wider text-[#86868B]">${t.simPresetLabel}</div>
              <div class="grid grid-cols-5 gap-1">
                <button data-q="15"     class="sim-q-btn py-1.5 rounded-xl text-[11px] font-mono-tech font-medium border transition ${simPreset === 'auto' && simDistanceCm === 15 ? 'bg-[#1D1D1F] text-white border-[#1D1D1F]' : 'bg-white/75 border-black/[0.08] hover:bg-white'}">15cm</button>
                <button data-q="25"     class="sim-q-btn py-1.5 rounded-xl text-[11px] font-mono-tech font-medium border transition ${simPreset === 'auto' && simDistanceCm === 25 ? 'bg-[#1D1D1F] text-white border-[#1D1D1F]' : 'bg-white/75 border-black/[0.08] hover:bg-white'}">25cm</button>
                <button data-q="60"     class="sim-q-btn py-1.5 rounded-xl text-[11px] font-mono-tech font-medium border transition ${simPreset === 'auto' && simDistanceCm === 60 ? 'bg-[#1D1D1F] text-white border-[#1D1D1F]' : 'bg-white/75 border-black/[0.08] hover:bg-white'}">60cm</button>
                <button data-q="noface" class="sim-q-btn py-1.5 rounded-xl text-[10px] font-medium border transition ${simPreset === 'noface' ? 'bg-[#1D1D1F] text-white border-[#1D1D1F]' : 'bg-white/75 border-black/[0.08] hover:bg-white'}">${t.simNoFace}</button>
                <button data-q="sleep"  class="sim-q-btn py-1.5 rounded-xl text-[10px] font-medium border transition ${simPreset === 'sleep' ? 'bg-[#1D1D1F] text-white border-[#1D1D1F]' : 'bg-white/75 border-black/[0.08] hover:bg-white'}">${t.simSleep}</button>
              </div>
            </div>

            <div class="rounded-xl bg-black/[0.03] border border-black/[0.05] p-3.5 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-semibold uppercase tracking-wider text-[#6E6E73]">${t.simDistLabel}</span>
                <span id="drawer-dist-val" class="text-[13px] font-mono-tech font-semibold text-[#1D1D1F]">${simDistanceCm} cm</span>
              </div>
              <input id="drawer-dist-slider" type="range" min="15" max="120" value="${simDistanceCm}" class="w-full" />
              <div class="text-[10px] font-mono-tech text-[#86868B]">${t.simHystHint}</div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div class="rounded-xl bg-white/80 border border-black/[0.06] p-2.5">
                <div class="text-[10px] text-[#86868B]">${t.simParallax}</div>
                <div id="drawer-parallax-val" class="text-[12px] font-mono-tech font-semibold text-[#1D1D1F] mt-0.5">${lastParallaxDeg.toFixed(1)}°</div>
              </div>
              <div class="rounded-xl bg-white/80 border border-black/[0.06] p-2.5">
                <div class="text-[10px] text-[#86868B]">${t.simDeadband}</div>
                <div class="text-[12px] font-mono-tech font-semibold text-[#1D1D1F] mt-0.5">2.0°</div>
              </div>
            </div>

            <button id="drawer-blink-btn" type="button" class="w-full py-2 rounded-xl bg-white border border-black/[0.1] hover:bg-black/[0.03] text-[12px] font-medium text-[#1D1D1F] transition">${t.simBlinkBtn}</button>

            <details class="rounded-xl bg-white/70 border border-black/[0.07] p-3">
              <summary class="text-[11px] font-semibold uppercase tracking-wider text-[#6E6E73] cursor-pointer list-none flex items-center justify-between">
                <span>${t.simManualTitle}</span><span class="text-[#86868B]">▾</span>
              </summary>
              <div class="mt-3 space-y-2.5 pt-2.5 border-t border-black/[0.06]">
                <div class="flex justify-end">
                  <button id="btn-man-reset" type="button" class="text-[11px] text-[#6E6E73] hover:text-[#1D1D1F] underline">${t.simResetNeutral}</button>
                </div>
                <div>
                  <div class="flex justify-between text-[11px] mb-1"><span>Pan</span><span id="man-pan-v" class="font-mono-tech">${Math.round(currPan)}°</span></div>
                  <input id="man-pan" type="range" min="-45" max="45" value="${Math.round(currPan)}" class="w-full" />
                </div>
                <div>
                  <div class="flex justify-between text-[11px] mb-1"><span>Tilt</span><span id="man-tilt-v" class="font-mono-tech">${Math.round(currTilt)}°</span></div>
                  <input id="man-tilt" type="range" min="-25" max="25" value="${Math.round(currTilt)}" class="w-full" />
                </div>
                <div>
                  <div class="flex justify-between text-[11px] mb-1"><span>Eyelid</span><span id="man-lid-v" class="font-mono-tech">${Math.round(currLid)}°</span></div>
                  <input id="man-lid" type="range" min="0" max="85" value="${Math.round(currLid)}" class="w-full" />
                </div>
              </div>
            </details>
          `;

          drawerBody.querySelectorAll('.sim-q-btn').forEach(b => {
            b.addEventListener('click', () => {
              const q = b.dataset.q;
              if (q === 'noface' || q === 'sleep') {
                simPreset = q;
              } else {
                simPreset = 'auto';
                simDistanceCm = parseInt(q, 10);
                lastCursorMoveMs = performance.now();
              }
              renderDrawer();
            });
          });
          document.getElementById('drawer-dist-slider').addEventListener('input', (e) => {
            simPreset = 'auto';
            simDistanceCm = parseInt(e.target.value, 10);
            lastCursorMoveMs = performance.now();
            document.getElementById('drawer-dist-val').textContent = `${simDistanceCm} cm`;
          });
          document.getElementById('drawer-blink-btn').addEventListener('click', () => {
            if (blinkProgress < 0) blinkProgress = 0;
          });
          const bindManual = (id, outId, setter) => {
            const el = document.getElementById(id);
            el.addEventListener('input', () => {
              setSimulationActive(false);
              const v = parseFloat(el.value);
              document.getElementById(outId).textContent = `${v}°`;
              setter(v); syncDockUI();
            });
          };
          bindManual('man-pan', 'man-pan-v', v => { targetPan = v; });
          bindManual('man-tilt', 'man-tilt-v', v => { targetTilt = v; });
          bindManual('man-lid', 'man-lid-v', v => { targetLid = v; });
          document.getElementById('btn-man-reset').addEventListener('click', () => {
            setSimulationActive(false);
            targetPan = 0; targetTilt = 0; targetLid = 0;
            renderDrawer(); syncDockUI();
          });
        }

        // --- C. HARDWARE & FASTENERS PANEL ---
        else if (activePanel === 'hardware') {
          drawerTitle.textContent = t.hwTitle;
          const actIds = ['pan_servo', 'tilt_servo', 'eyelid_servo'];
          const elecIds = ['esp32', 'breadboard', 'elko', 'jack_dc', 'adapter'];

          const renderCompBtn = (cid) => {
            const c = t.comps[cid];
            return `
              <button data-cid="${cid}" class="hw-comp-btn w-full text-left px-3 py-2.5 rounded-xl bg-white/80 hover:bg-white border border-black/[0.07] hover:border-black/[0.2] transition flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="text-[12px] font-semibold text-[#1D1D1F] truncate">${c.name}</div>
                  <div class="text-[10px] text-[#86868B] font-mono-tech">${c.cat}</div>
                </div>
                <span class="text-[#86868B] text-xs shrink-0">›</span>
              </button>
            `;
          };

          const fastenerRows = t.fastenersList.map(f => `
            <div class="py-2 border-b border-black/[0.05] last:border-b-0 flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="text-[11px] font-semibold text-[#1D1D1F]">${f.loc}</div>
                <div class="text-[11px] font-mono-tech text-[#6E6E73]">${f.spec}</div>
              </div>
              <span class="text-[10px] font-mono-tech px-1.5 py-0.5 rounded bg-black/[0.05] text-[#1D1D1F] shrink-0">${f.qty}</span>
            </div>
          `).join('');

          drawerBody.innerHTML = `
            <p class="text-[12px] text-[#6E6E73] leading-relaxed">${t.hwHint}</p>
            <div class="space-y-1.5">
              <div class="text-[10px] font-semibold uppercase tracking-wider text-[#86868B]">${t.hwSecActuators}</div>
              ${actIds.map(renderCompBtn).join('')}
            </div>
            <div class="space-y-1.5">
              <div class="text-[10px] font-semibold uppercase tracking-wider text-[#86868B]">${t.hwSecElectronics}</div>
              ${elecIds.map(renderCompBtn).join('')}
            </div>
            <div class="space-y-2 pt-1">
              <div class="flex items-center justify-between">
                <span class="text-[10px] font-semibold uppercase tracking-wider text-[#86868B]">${t.hwSecFasteners}</span>
                <button data-cid="fasteners" class="hw-comp-btn text-[11px] font-medium text-[#1D1D1F] underline underline-offset-2">3D</button>
              </div>
